<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/logo/favicon.ico" type="image/x-icon" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
		<link rel="preload" href="/fonts/aiban/Inter-Regular.core.woff" as="font" type="font/woff" crossorigin />
		<script nonce="%sveltekit.nonce%">
			// Apply the saved theme before first paint to avoid a light/dark flash. Values: light, dark, system.
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				var d = localStorage.getItem('density');
				if (d === 'compact') document.documentElement.setAttribute('data-density', 'compact');
				// Language: the visitor's pick, else the browser's first language (see src/lib/i18n/detect.ts).
				var l = localStorage.getItem('lang.chosen') === '1' ? localStorage.getItem('lang') : (navigator.languages && navigator.languages[0]) || navigator.language;
				if (l && /^[a-z]{2,3}([-_][A-Za-z]{2,4})?$/.test(l)) {
					document.documentElement.lang = l;
					if (/^(ar|fa|ur|he|ps|sd|ug|yi|dv|ks|ku|arz|apc|apd|pes|pnb)([-_]|$)/.test(l)) document.documentElement.dir = 'rtl';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript><p style="margin: 0; padding: 16px; font-family: system-ui, sans-serif;">AIBAN needs JavaScript to run. Turn it on in your browser settings, then reload this page.</p></noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
